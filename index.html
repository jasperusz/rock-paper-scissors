<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <script src="rpsgame.js" defer></script>
    <link rel="stylesheet" href="styles\styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="content">
        <h1 id="title">LET'S PLAY ROCK, PAPER AND SCISSORS!</h1>
        <div class="center-container">
            <p id="scoresTitle">SCORES:</p>
            <div class="resultados"><p id="playerScore">PLAYER: 0</p> <p id="computerScore">COMPUTER: 0</p> <p id="drawScore">DRAWS: 0</p></div>
            <div class="console">
                <p id="consoleText">Good Luck!</p>
            </div>
            <div class="selection">
            <button class="choice" id="rockbutton" onclick="playRound('rock')">ROCK</button>
            <button class="choice" id="paperbutton" onclick="playRound('paper')">PAPER</button>
            <button class="choice" id="scissorsbutton" onclick="playRound('scissors')">SCISSORS</button>
            <button class="choice" id="playagain" onclick="playRound()">PLAY</button>
            </div>
        </div>
    </div>
</body>
</html>
